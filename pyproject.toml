[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptriage"
version = "0.1.0"
description = "Diagnose MCP connection failures from captured JSON-RPC transcripts and client config files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "json-rpc", "debugging", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debugging",
]

[project.scripts]
mcptriage = "mcptriage.cli:main"

[tool.setuptools]
packages = ["mcptriage"]
